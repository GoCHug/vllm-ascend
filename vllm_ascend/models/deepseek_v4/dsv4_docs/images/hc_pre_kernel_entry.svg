<text x="40" y="420" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">Part1（AIC）：x·Wᵀ / x·xᵀ → ws2 / ws3；Part2（AIV）：ws2 / ws3 → r / pre / post / comb / y。</text>
<text x="40" y="446" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">tilingData 里的 bs、k、mDimNum、kDimNum、mL1Size、kL1Size、cvLoopKSize、cubeBlockDimK、prePostCoreNum 决定循环和分支。</text>
<text x="40" y="472" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">blockIdx 在 AIV 上除以 2；AIC 用 mBlkDimIdx = blockIdx / cubeBlockDimK、kBlkDimIdx = blockIdx % cubeBlockDimK。</text>
