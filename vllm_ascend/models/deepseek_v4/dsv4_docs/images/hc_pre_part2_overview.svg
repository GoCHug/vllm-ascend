<line x1="480" y1="156" x2="470" y2="298" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="480" y1="156" x2="560" y2="298" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="480" y1="156" x2="700" y2="298" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="930" y="300" width="140" height="86" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="1000" y="328" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#15803d">y（T×7168, bf16）</text>
<text x="1000" y="350" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#475569">y = Σⱼ preⱼ · xⱼ</text>
<line x1="760" y1="158" x2="960" y2="298" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="322" y1="340" x2="928" y2="340" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="550" y="432" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#64748b">r 只算一次；pre/post/comb 三路各自加自己的 s、b；y 按行、按 D 块重读 bf16 x（不读 ws1 的 fp32 副本）。</text>
</svg>
