<text x="315.0" y="133" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#334155">Σ 3 段</text>
<text x="315.0" y="153" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">(2048, 16)</text>
<line x1="370" y1="140" x2="406" y2="140" stroke="#94a3b8" stroke-width="2"/>
<path d="M 399 136 L 406 140 L 399 144 z" fill="#94a3b8"/>
