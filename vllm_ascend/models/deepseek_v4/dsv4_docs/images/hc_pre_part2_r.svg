<rect x="58" y="127" width="154" height="10" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<rect x="58" y="141" width="154" height="10" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="135.0" y="100" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#334155">ws3 K0/K1/K2</text>
<text x="135.0" y="169" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="8.5" font-weight="normal" fill="#64748b">[3][2048][16]</text>
