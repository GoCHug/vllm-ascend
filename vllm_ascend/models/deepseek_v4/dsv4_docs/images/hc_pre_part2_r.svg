<text x="490.0" y="153" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">(2048,)</text>
<line x1="570" y1="140" x2="606" y2="140" stroke="#94a3b8" stroke-width="2"/>
<path d="M 599 136 L 606 140 L 599 144 z" fill="#94a3b8"/>
<rect x="610" y="105" width="240" height="70" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="730.0" y="133" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#334155">×1/k → +eps</text>
<text x="730.0" y="153" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">sqrt → 倒数</text>
<line x1="850" y1="140" x2="886" y2="140" stroke="#94a3b8" stroke-width="2"/>
<path d="M 879 136 L 886 140 L 879 144 z" fill="#94a3b8"/>
<rect x="890" y="105" width="180" height="70" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="980.0" y="133" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#334155">r (2048,)</text>
<text x="980.0" y="153" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">每 token 1 个</text>
<text x="50" y="220" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b">CalcRsqrt：CopyIn(nBurst=3) → ReduceSumARAPerf → GatherMaskByDiagonal(T%16)</text>
<text x="50" y="246" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b">→ ×1/k → +normEps → Sqrt → Div(1, ·)；k = 28672，不是单条流的 7168。</text>
</svg>
