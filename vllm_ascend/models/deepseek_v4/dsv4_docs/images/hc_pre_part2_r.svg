<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="290" viewBox="0 0 1100 290">
<rect width="1100" height="290" fill="#ffffff"/>
<text x="550" y="36" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">① r：ws3 跨段求和 → 取对角 → 逆均方根</text>
<text x="550" y="62" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#64748b">输入 ws3 [3][2048][16]；16 行一组取对角，每 token 一个 r</text>
<rect x="50" y="105" width="170" height="70" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
