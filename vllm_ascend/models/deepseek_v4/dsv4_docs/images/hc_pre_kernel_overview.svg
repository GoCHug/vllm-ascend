<text x="335.0" y="222" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">Part1 → Part2</text>
<rect x="450" y="90" width="190" height="190" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
<rect x="450" y="90" width="190" height="5" rx="2.5" fill="#ea580c"/>
<text x="545.0" y="120" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c2d12">Part1 · 24 AIC</text>
<text x="545.0" y="150" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">AIV: bf16 → fp32</text>
<text x="545.0" y="174" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">→ ws1</text>
<text x="545.0" y="198" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">x·Wᵀ / x·xᵀ</text>
<text x="545.0" y="222" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">→ ws2 / ws3</text>
<rect x="660" y="90" width="190" height="190" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
<rect x="660" y="90" width="190" height="5" rx="2.5" fill="#9333ea"/>
<text x="755.0" y="120" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="13" font-weight="700" fill="#581c87">Part2 · 48 AIV</text>
<text x="755.0" y="150" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">Σ 3 段 + 对角</text>
<text x="755.0" y="174" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">r / pre / post / comb</text>
<text x="755.0" y="198" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">y = Σ pre_j x_j</text>
<text x="755.0" y="222" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">p + (48-p) 分组</text>
<rect x="870" y="90" width="190" height="190" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<rect x="870" y="90" width="190" height="5" rx="2.5" fill="#0d9488"/>
<text x="965.0" y="120" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="13" font-weight="700" fill="#134e4a">Python</text>
<text x="965.0" y="150" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">y bf16</text>
<text x="965.0" y="174" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">post / comb / pre fp32</text>
<text x="965.0" y="198" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">同一块 NPU 显存</text>
<text x="965.0" y="222" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">无 D2H</text>
