<text x="550" y="58" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#64748b">tiling 选分支；Part1 由 AIV cast + 24 AIC 做两个 matmul；Part2 用 48 AIV 收尾</text>
