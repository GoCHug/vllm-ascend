<text x="335.0" y="120" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d">Kernel hc_pre</text>
<text x="335.0" y="150" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">TILING_KEY_IS(0/1/2)</text>
<text x="335.0" y="174" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#334155">GET_TILING_DATA</text>
