<path d="M 240 185 L 232 181 L 232 189 z" fill="#94a3b8"/>
<line x1="430" y1="185" x2="444" y2="185" stroke="#94a3b8" stroke-width="2"/>
<path d="M 450 185 L 442 181 L 442 189 z" fill="#94a3b8"/>
<line x1="640" y1="185" x2="654" y2="185" stroke="#94a3b8" stroke-width="2"/>
<path d="M 660 185 L 652 181 L 652 189 z" fill="#94a3b8"/>
<line x1="850" y1="185" x2="864" y2="185" stroke="#94a3b8" stroke-width="2"/>
<path d="M 870 185 L 862 181 L 862 189 z" fill="#94a3b8"/>
<text x="50" y="330" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b">AIV 先把 bf16 x cast 成 fp32 写 ws1；AIC 从 ws1 读 A1、从 GM 读 hc_fn B1，发 x·Wᵀ / x·xᵀ 两个 Mmad。</text>
<text x="50" y="356" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b">Part1 只写 3 段 K 的部分和；Part2 跨段求和，得到完整 r 和 24 列 logits，再算 pre / post / comb / y。</text>
<text x="50" y="382" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b">key0 把 48 AIV 分成 p / 48-p；key1 不分组，48 个 AIV 都走 ProcessOriginal。</text>
</svg>
