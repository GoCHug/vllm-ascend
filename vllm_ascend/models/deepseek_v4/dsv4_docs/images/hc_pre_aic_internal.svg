<rect x="774" y="155" width="96" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="822.0" y="182" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1d4ed8">1024</text>
<rect x="876" y="155" width="96" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="924.0" y="182" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1d4ed8">1024</text>
<rect x="978" y="155" width="62" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="1009" y="182" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1d4ed8">512</text>
<text x="60" y="220" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b">K0/K1：9×1024 + 512 = 10 拍；K2：9×1024 = 9 拍（无尾拍）</text>
<circle cx="60" cy="252" r="13" fill="#ea580c"/>
<text x="60" y="257" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
<text x="82" y="248" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">AIC：按 128 列取进 L1</text>
<text x="82" y="268" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">一拍 1024 = 8 × 128；A1 是 256×128 的 x，B1 是 24×128 的 hc_fn</text>
<rect x="60" y="285" width="110" height="34" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="115" y="306" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#c2410c">128</text>
