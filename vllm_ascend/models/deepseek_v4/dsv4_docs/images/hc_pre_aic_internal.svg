<rect x="640" y="285" width="110" height="34" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="695" y="306" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#c2410c">128</text>
<rect x="756" y="285" width="110" height="34" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="811" y="306" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#c2410c">128</text>
<rect x="872" y="285" width="110" height="34" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="927" y="306" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#c2410c">128</text>
<text x="60" y="336" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#64748b">尾拍 512 只有 4 块</text>
<circle cx="60" cy="370" r="13" fill="#16a34a"/>
<text x="60" y="375" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
<text x="82" y="366" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">AIC：每块 L1 发两个 Mmad</text>
<text x="82" y="386" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">同一份 A1 既当左操作数，也当右操作数</text>
<rect x="60" y="405" width="230" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="72" y="430" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1e3a8a">A1 (256×128)</text>
<text x="72" y="450" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#7c2d12">B1 (24×128)</text>
<rect x="330" y="405" width="320" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="342" y="429" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#14532d">x·Wᵀ → 256×24 → L0C</text>
<rect x="330" y="451" width="320" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="342" y="475" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10" font-weight="700" fill="#14532d">x·xᵀ → 16×16 tile → L0C（只取对角）</text>
<line x1="290" y1="424" x2="326" y2="424" stroke="#94a3b8" stroke-width="2"/>
<line x1="290" y1="460" x2="326" y2="470" stroke="#94a3b8" stroke-width="2"/>
<circle cx="60" cy="535" r="13" fill="#94a3b8"/>
<text x="60" y="540" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
<text x="82" y="531" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">AIC：10 拍累加，最后一次 Fixp</text>
<text x="82" y="551" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">所有 L1 块累加到同一个 L0C；只有最后一个 beat 的最后一块才 Fixp</text>
<rect x="60" y="570" width="800" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="76" y="595" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#334155">L0C 累加：K0/K1 = 9×8 + 4 = 76 块；K2 = 9×8 = 72 块</text>
<text x="76" y="615" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#334155">最后一块 K → Fixp → ws2 / ws3</text>
<text x="60" y="662" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10" font-weight="normal" fill="#64748b">cvLoopKSize=1024 是 AIV/AIC 交接粒度；kL1=128 是 L1 取数粒度；双缓冲让 AIV 写下一拍时 AIC 算当前拍。</text>
</svg>
