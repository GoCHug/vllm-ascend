<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
<rect width="1100" height="700" fill="#ffffff"/>
<text x="550" y="38" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">AIC 这一段：AIV 喂一拍，AIC 累加 10 拍</text>
<text x="550" y="64" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#64748b">K0/K1：9728 = 9×1024 + 512（10 拍）；K2：9216 = 9×1024（9 拍）</text>
<circle cx="60" cy="120" r="13" fill="#2563eb"/>
<text x="60" y="125" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
<text x="82" y="116" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">前置：AIV 先 cast</text>
<text x="82" y="136" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#64748b">每拍取 256×1024 的 bf16 x，转成 fp32 写进 ws1</text>
<rect x="60" y="155" width="96" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
